[package]
name = "wacu"
version = "0.2.0"
edition = "2024"
description = "Wacu - a tiny native AI usage watcher"
build = "build.rs"

[dependencies]
slint = { version = "=1.18.1", default-features = false, features = ["compat-1-18", "std", "backend-winit", "renderer-femtovg", "system-tray", "raw-window-handle-06", "unstable-winit-030"] }
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
png = "0.18"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
    "Win32_System_Registry",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_UI_Shell"
] }

[build-dependencies]
slint-build = "=1.18.1"
embed-resource = "=3.0.12"

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
