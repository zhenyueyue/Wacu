[package]
name = "wacu"
version = "0.1.0"
description = "A quiet watcher for AI usage"
authors = ["Wacu contributors"]
edition = "2024"

[lib]
name = "wacu_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
